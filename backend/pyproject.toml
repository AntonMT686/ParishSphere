[project]
name = "parishsphere-backend"
version = "0.1.0"
description = "ParishSphere – multi-tenant parish management API"
requires-python = ">=3.12"
dependencies = [  # pinned in requirements.txt
  "fastapi[standard]>=0.115,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "pymysql>=1.1",
  "cryptography>=43",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "python-ulid>=3.0",
  "redis>=5.2",
  "celery>=5.4",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
ps-admin = "app.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]
"scripts/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
